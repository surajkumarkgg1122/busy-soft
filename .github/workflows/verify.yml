name: Verify

on:
  push:
    branches: [master, 'cleanup/**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/check-accounting-boundary.mjs
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build
      - run: npx tsc --noEmit
