name: CI
on:
  push:
    branches: [master, production-hardening-2026-09]
  pull_request:
    branches: [master, production-hardening-2026-09]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Lint gate
        run: npm run lint
      - name: Critical production QA gate
        run: npm run test:critical
      - name: Full test suite
        run: npm test
      - name: Production build gate
        run: npm run build
