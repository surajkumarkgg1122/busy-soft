name: Production Verification

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Accounting dependency boundary
        run: node scripts/check-accounting-boundary.mjs
      - name: Lint
        run: npm run lint
      - name: Accounting regression suite
        run: npm test -- --run
      - name: Accounting invariant smoke test
        run: npx --yes tsx@4.20.3 scripts/accounting-smoke.ts
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
